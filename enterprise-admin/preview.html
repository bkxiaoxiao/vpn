<div id="overlay"></div><div id="toast" role="status"></div><script>const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',layers:'m12 3 9 5-9 5-9-5 9-5 M3 12l9 5 9-5 M3 16l9 5 9-5',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c5 5 5 13 0 18-5-5-5-13 0-18',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',shield:'M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7l-9-4 M8 12l3 3 5-6',history:'M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v5l3 2',settings:'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',plus:'M12 5v14 M5 12h14',refresh:'M20 7v5h-5 M4 17v-5h5 M5 8a8 8 0 0 1 13-3l2 2 M19 16a8 8 0 0 1-13 3l-2-2',arrow:'M5 12h14 M14 7l5 5-5 5',chevron:'m9 5 7 7-7 7',search:'M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M15 15l6 6',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',check:'m5 12 4 4L19 6',alert:'m12 3 10 18H2L12 3 M12 9v5 M12 17v.1',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',server:'M3 3h18v7H3z M3 14h18v7H3z M7 6.5h.01 M7 17.5h.01',monitor:'M3 3h18v13H3z M12 16v5 M8 21h8',phone:'M7 2h10v20H7z M11 18h2',apple:'M15 3c0 2-1 3-3 3 M12 8c-6-4-10 2-7 9 2 5 4 5 7 3 3 2 5 2 7-3-4-2-4-5-1-7-2-3-4-3-6-2',windows:'M3 5l8-1v8H3z M13 4l8-1v9h-8z M3 14h8v7l-8-1z M13 14h8v9l-8-1z',cloud:'M7 18a5 5 0 1 1-1-10 7 7 0 0 1 13 1 4.5 4.5 0 0 1-1 9H7',external:'M14 3h7v7 M21 3 10 14 M10 3H3v18h18v-7',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',filter:'M3 5h18 M6 12h12 M10 19h4',more:'M5 12h.1 M12 12h.1 M19 12h.1'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navs=[['overview','grid','总览'],['resources','globe','订阅与节点'],['pools','layers','资源池'],['employees','users','员工与设备'],['releases','shield','配置发布'],['audit','history','审计记录'],['settings','settings','工作空间设置']];
const initial={resources:[{id:1,name:'全球优选 · 主力订阅',vendor:'供应商 A',format:'Clash',nodes:48,status:'正常',updated:'2 分钟前',region:'香港 / 日本 / 美国'},{id:2,name:'亚太专线 · 办公订阅',vendor:'供应商 B',format:'sing-box',nodes:24,status:'正常',updated:'12 分钟前',region:'香港 / 新加坡 / 日本'},{id:3,name:'北美业务 · 专属线路',vendor:'供应商 C',format:'Clash',nodes:16,status:'即将到期',updated:'35 分钟前',region:'美国 / 加拿大'},{id:4,name:'备用节点 · 东京',vendor:'独立采购',format:'VLESS',nodes:1,status:'正常',updated:'1 小时前',region:'日本'}],pools:[{id:1,name:'全员办公',desc:'日常办公与协作服务，面向全体员工。',icon:'◎',count:32,members:128,depts:'全体员工',sources:[1,2]},{id:2,name:'海外业务',desc:'电商运营与海外业务专属线路。',icon:'↗',count:24,members:46,depts:'海外运营 · 市场部',sources:[1,3]},{id:3,name:'研发专用',desc:'代码托管、开发服务和技术协作。',icon:'⌘',count:16,members:24,depts:'产品研发部',sources:[2,4]}],employees:[{id:1,name:'陈可欣',initial:'陈',email:'kexin.chen',dept:'海外运营',pool:'海外业务',devices:3,platform:'Windows · iOS',status:'已同步'},{id:2,name:'王子涵',initial:'王',email:'zihan.wang',dept:'产品研发',pool:'研发专用',devices:2,platform:'macOS · Android',status:'已同步'},{id:3,name:'李明',initial:'李',email:'ming.li',dept:'市场营销',pool:'全员办公',devices:2,platform:'macOS · iOS',status:'待同步'},{id:4,name:'张宇',initial:'张',email:'yu.zhang',dept:'海外运营',pool:'海外业务',devices:1,platform:'Windows',status:'已同步'},{id:5,name:'刘思远',initial:'刘',email:'siyuan.liu',dept:'产品研发',pool:'研发专用',devices:2,platform:'macOS · iOS',status:'已停用'},{id:6,name:'赵雨桐',initial:'赵',email:'yutong.zhao',dept:'人力资源',pool:'全员办公',devices:2,platform:'Windows · Android',status:'已同步'}],revision:24,settings:{workspace:'RitFit Workspace',tenant:'ritfit',interval:'每 15 分钟',limit:'3 台设备',grace:'4 小时',auto:true,leaver:true},logs:[{action:'更新订阅',target:'全球优选 · 主力订阅',actor:'系统定时任务',time:'今天 10:42',status:'成功'},{action:'分配资源池',target:'海外运营 → 海外业务',actor:'Jack',time:'今天 10:35',status:'成功'},{action:'发布配置',target:'v1.0.24 · 全部员工',actor:'Jack',time:'今天 09:30',status:'成功'},{action:'员工首次登录',target:'陈可欣 · iOS',actor:'飞书身份认证',time:'今天 09:12',status:'成功'},{action:'同步订阅',target:'北美业务 · 专属线路',actor:'系统定时任务',time:'今天 08:42',status:'需关注'}]};
let state;try{state=JSON.parse(localStorage.getItem('relay-ui-v1'))||structuredClone(initial)}catch{state=structuredClone(initial)}
let page=navs.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview',resourceTab='all',query='',filter='all',chartRange='week';
let toastTimer,modalReturnFocus;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem('relay-ui-v1',JSON.stringify(state));
const badge=(s)=>`<span class="badge ${/待|即将|关注/.test(s)?'warn':/停用|未连接/.test(s)?'neutral':''}"><i class="${/待|即将|关注/.test(s)?'amber-dot':'green-dot'}"></i>${esc(s)}</span>`;
const btn=(label,action,ic='plus',primary=false)=>`<button class="btn ${primary?'primary':''}" data-action="${action}">${icon(ic)}${label}</button>`;
const heading=(eyebrow,title,desc,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
const ph=(title,desc,link='',target='')=>`<div class="panel-header"><div><h2>${title}</h2><p>${desc}</p></div>${link?`<button class="text-link" data-nav="${target}">${link}${icon('arrow')}</button>`:''}</div>`;
function notify(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200)}
function log(action,target){state.logs.unshift({action,target,actor:'Jack',time:'刚刚',status:'成功'});save()}
function go(p){page=p;query='';filter='all';location.hash=p;render();window.scrollTo(0,0)}
function render(){$('#workspace-name').textContent=state.settings.workspace;document.title=`${navs.find(n=>n[0]===page)[2]} · Relay`;$('#crumb').textContent=navs.find(n=>n[0]===page)[2];$('#navigation').innerHTML=navs.map(([id,ic,label],i)=>`<button data-nav="${id}" aria-label="${label}" title="${label}" class="${id===page?'active ':''}${i===6?'nav-section':''}" ${id===page?'aria-current="page"':''}>${icon(ic)}<span class="nav-text">${label}</span>${i===1?`<span class="count">${state.resources.length}</span>`:''}</button>`).join('');$('#bell').innerHTML=icon('bell');$('#main').innerHTML=({overview,resources,pools,employees,releases,audit,settings})[page]();}
const stat=(title,number,unit,ic,bottom,spark=false)=>`<article class="stat"><div class="stat-top">${title}<span class="stat-icon">${icon(ic)}</span></div><div class="stat-number">${number}${unit?`<small>${unit}</small>`:''}</div><div class="stat-bottom">${bottom}</div>${spark?'<div class="spark"><svg viewBox="0 0 80 25"><path d="M1 22 10 17 18 20 27 10 35 15 45 7 54 11 64 4 78 1"/></svg></div>':''}</article>`;
function overview(){return heading('WORKSPACE OVERVIEW','每一次连接，尽在掌握','统一管理网络资源，让团队在任何地方都能顺畅工作。',btn('同步全部订阅','sync','refresh')+btn('导入资源','import','plus',true))+`<section class="stats">${stat('订阅资源',state.resources.length,'个','globe','<span class="positive">↗ 2 个</span> 较上月新增',true)}${stat('节点总数',state.resources.reduce((n,r)=>n+r.nodes,0),'个','server','<span class="positive">● 96.6% 可用</span> <span>覆盖 12 个地区</span>')}${stat('已授权员工','128','人','users','<span class="positive">↗ 12 人</span> 较上月新增',true)}${stat('配置同步率','96.9','%','shield','<span class="positive">124 人已同步</span> <span>4 人待同步</span>')}</section><section class="middle-grid"><article class="panel">${ph('团队连接趋势','过去 7 天的活跃设备与配置同步情况')}<div style="position:absolute"></div><div class="chart-legend"><span><i></i>活跃设备</span><span><i></i>配置同步</span><div class="segmented" style="margin-left:auto;margin-top:-5px"><button data-range="week" class="${chartRange==='week'?'selected':''}">近 7 天</button><button data-range="month" class="${chartRange==='month'?'selected':''}">近 30 天</button></div></div>${chart()}<div class="chart-note">${icon('clock')}最近同步于今天 10:42 <span style="margin-left:auto">桌面端与移动端 · 演示趋势</span></div></article><article class="panel">${ph('资源健康状况','及时发现影响团队连接的问题')}<div class="health-score"><div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="33" stroke="#f0f3ec"/><circle cx="40" cy="40" r="33" stroke="#9bb587" stroke-dasharray="201 208"/></svg><div class="ring-label">96.6<small>%</small></div></div><div><b>整体运行良好</b><p>86 个节点可用<br>3 个节点需要关注</p></div></div><div class="health-list"><div class="health-item"><span><i class="green-dot"></i>订阅同步</span><b>全部完成</b></div><div class="health-item"><span><i class="green-dot"></i>飞书身份服务</span><b>连接正常</b></div><div class="health-item"><span><i class="amber-dot"></i>订阅有效期</span><button class="text-link" data-action="expiry">1 项即将到期 ${icon('chevron')}</button></div></div><button class="health-bottom" data-action="expiry" style="width:calc(100% - 44px);text-align:left">${icon('alert')}北美业务订阅将在 7 天后到期 ${icon('chevron')}</button></article></section><section class="bottom-grid"><article class="panel table-panel">${ph('订阅资源','集中接入外购订阅与独立节点','查看全部','resources')}${resourceTable(state.resources.slice(0,3),true)}<div class="table-foot"><span>订阅由服务端统一拉取，客户端按权限获取配置</span><span>${state.resources.length} 个资源</span></div></article><article class="panel">${ph('资源池分配','为不同团队配置合适的连接资源','管理','pools')}<div class="pool-list">${state.pools.slice(0,3).map(p=>`<div class="pool-row"><div class="pool-top"><span class="pool-square">${p.icon}</span><span><b>${esc(p.name)}</b><small>${esc(p.depts)}</small></span><span>${p.members} 人</span></div><div class="pool-progress"><div class="track"><i style="width:${Math.min(95,p.members/1.5)}%"></i></div><small>${p.count} 个节点</small></div></div>`).join('')}</div><div class="inline-note">资源池可同时分配给多个部门或员工</div></article></section>`}
function chart(){const month=chartRange==='month';return `<div class="chart-wrap"><div class="chart-y"><span>200</span><span>150</span><span>100</span><span>50</span><span>0</span></div><div class="chart"><svg viewBox="0 0 600 155" preserveAspectRatio="none" role="img" aria-label="演示数据：活跃设备和配置同步趋势"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b6cfa7" stop-opacity=".29"/><stop offset="1" stop-color="#dbe7d1" stop-opacity=".05"/></linearGradient></defs><path d="M0 113C35 108 53 96 100 100S165 67 200 76 266 82 300 50 360 66 400 37 462 51 500 27 560 39 600 18V155H0Z" fill="url(#area)"/><path d="M0 132C40 125 60 130 100 115S162 115 200 101 260 116 300 86 356 103 400 75 462 90 500 58 565 73 600 49" stroke="#c4d2bd" stroke-width="1.7" fill="none" stroke-dasharray="4 5"/><path d="${month?'M0 132C35 130 62 120 100 125S160 93 200 100 265 64 300 74 360 42 400 52 460 22 500 31 555 10 600 18':'M0 113C35 108 53 96 100 100S165 67 200 76 266 82 300 50 360 66 400 37 462 51 500 27 560 39 600 18'}" fill="none" stroke="#7a9a75" stroke-width="2.2"/><circle cx="600" cy="18" r="3.5" fill="#71966d" stroke="white" stroke-width="2"/></svg></div><div class="chart-x">${(month?['10/06','10/11','10/16','10/21','10/26','10/31','11/04']:['10/29','10/30','10/31','11/01','11/02','11/03','11/04']).map(d=>`<span>${d}</span>`).join('')}</div></div>`}
function resourceTable(rows,compact=false){return `<div class="table-wrap"><table><thead><tr><th>资源名称</th>${compact?'':'<th>格式</th>'}<th>节点数</th><th>状态</th><th class="${compact?'wide-only':''}">最近同步</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><div class="resource-title"><span class="resource-icon">${icon(r.nodes===1?'server':'globe')}</span><span><strong>${esc(r.name)}</strong><small>${esc(r.vendor)}${compact?' · '+esc(r.format):' · '+esc(r.region)}</small></span></div></td>${compact?'':`<td><span class="badge neutral">${esc(r.format)}</span></td>`}<td>${r.nodes}</td><td>${badge(r.status)}</td><td class="${compact?'wide-only':''}">${esc(r.updated)}</td><td><button class="icon-button" data-detail="${r.id}" aria-label="查看 ${esc(r.name)}">${icon('more')}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">没有找到符合条件的资源</td></tr>'}</tbody></table></div>`}
function filteredResources(){return state.resources.filter(r=>(resourceTab!=='nodes'||r.nodes===1)&&(resourceTab!=='subscriptions'||r.nodes!==1)&&(filter==='all'||r.status===filter)&&(`${r.name} ${r.vendor} ${r.region}`.toLowerCase().includes(query.toLowerCase())))}
function resources(){return heading('RESOURCE MANAGEMENT','订阅与节点','把分散采购的资源，变成团队可用的连接能力。',btn('同步全部','sync','refresh')+btn('导入资源','import','plus',true))+`<div class="page-tabs">${[['all','全部资源',state.resources.length],['subscriptions','订阅',state.resources.filter(r=>r.nodes>1).length],['nodes','独立节点',state.resources.filter(r=>r.nodes===1).length]].map(([id,label,count])=>`<button data-tab="${id}" class="${resourceTab===id?'selected':''}">${label}<small>${count}</small></button>`).join('')}</div><section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input id="search-input" aria-label="搜索资源" placeholder="搜索资源名称、供应商或地区" value="${esc(query)}"></label><select id="status-filter" aria-label="按状态筛选"><option value="all">全部状态</option><option ${filter==='正常'?'selected':''}>正常</option><option ${filter==='即将到期'?'selected':''}>即将到期</option></select></div><div id="results">${resourceTable(filteredResources())}</div><div class="table-foot"><span>上游订阅地址仅保存在服务端，不向员工展示</span><span id="result-count">共 ${filteredResources().length} 个资源</span></div></section><div class="note-box" style="margin-top:20px">${icon('shield')}<span>外购节点的准入权限由供应商控制。停用员工将阻止后续配置同步；已获取的共享节点凭证，需要供应商轮换后才能失效。</span></div>`}
function pools(){return heading('RESOURCE POOLS','资源池','按用途组织节点，按团队分配访问权限。',btn('创建资源池','new-pool','plus',true))+`<div class="pool-cards">${state.pools.map(p=>`<article class="panel pool-card"><div class="pool-card-head"><span class="pool-square">${esc(p.icon)}</span><span class="badge neutral">${p.sources.length} 个来源</span></div><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p><div class="pool-meta"><span><b>${p.count}</b><small>节点</small></span><span><b>${p.members}</b><small>已分配员工</small></span></div><button class="btn" data-pool="${p.id}">管理分配 ${icon('arrow')}</button></article>`).join('')}</div><div class="section-title"><h2>分配规则</h2><span class="muted" style="font-size:10px">部门规则与个人分配取并集</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>资源池</th><th>授权范围</th><th>更新方式</th><th>状态</th><th></th></tr></thead><tbody>${state.pools.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.depts)}</td><td>登录后自动同步</td><td>${badge('已启用')}</td><td><button class="text-link" data-pool="${p.id}">编辑 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function employeeTable(){const rows=state.employees.filter(e=>`${e.name} ${e.dept} ${e.email}`.toLowerCase().includes(query.toLowerCase())&&(filter==='all'||e.status===filter));return `<div class="table-wrap"><table><thead><tr><th>员工</th><th>部门</th><th>资源池</th><th>设备</th><th>配置状态</th><th></th></tr></thead><tbody>${rows.length?rows.map(e=>`<tr><td><div class="employee"><span class="avatar">${esc(e.initial)}</span><span><strong>${esc(e.name)}</strong><small>${esc(e.email)}</small></span></div></td><td>${esc(e.dept)}</td><td>${esc(e.pool)}</td><td>${e.devices} 台<small style="display:block;font-size:9px;margin-top:5px;color:#9aa691">${esc(e.platform)}</small></td><td>${badge(e.status)}</td><td><button class="text-link" data-employee="${e.id}">管理 ${icon('chevron')}</button></td></tr>`).join(''):'<tr><td class="empty" colspan="6">没有匹配的员工</td></tr>'}</tbody></table></div>`}
function employees(){return heading('PEOPLE & DEVICES','员工与设备','通过飞书组织身份，让正确的人获得合适的资源。',btn('同步飞书组织','feishu-sync','refresh'))+`<section class="stats">${stat('已授权员工','128','人','users','当前组织可用范围')}${stat('已绑定设备','216','台','monitor','每位员工最多 '+esc(state.settings.limit))}${stat('待同步员工','4','人','clock','下次启动客户端时自动同步')}${stat('飞书组织','已连接','','link','<span class="positive">● RitFit</span> 企业自建应用')}</section><section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input id="search-input" placeholder="搜索员工姓名、部门" aria-label="搜索员工" value="${esc(query)}"></label><select id="status-filter" aria-label="筛选员工状态"><option value="all">全部状态</option>${['已同步','待同步','已停用'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div><div id="results">${employeeTable()}</div><div class="table-foot"><span>展示 6 位示例员工 · 组织信息由飞书同步</span><span>身份与设备统一管理</span></div></section>`}
function releases(){return heading('CONFIGURATION DELIVERY','配置发布','每次变更都有版本，每次同步都有回执。',btn('发布新版本','publish','plus',true))+`<section class="release-layout"><article class="panel release-hero"><div class="stat-top">当前生效版本 ${badge('已发布')}</div><div class="release-number">v1.0.${state.revision} <small>组织默认配置</small></div><p>全员办公路由优化；更新亚太地区可用节点。<br>发布后，客户端将在下一次同步时获取配置。</p><div class="release-track"><i></i></div><div class="stat-bottom"><span class="positive">124 / 128 人已同步</span><span style="margin-left:auto">96.9%</span></div><div class="platforms">${[['windows','Windows','62 台'],['apple','macOS','58 台'],['phone','Android','41 台'],['apple','iOS','55 台']].map(([ic,p,n])=>`<div class="platform">${icon(ic)}<b>${p}</b><small>${n} · 演示设备</small></div>`).join('')}</div></article><article class="panel">${ph('发布动态','跟踪配置从发布到运行的状态')}<div class="timeline"><div class="event"><b>配置已发布</b><p>v1.0.${state.revision} 已分配至全部授权员工</p><small>今天 09:30 · Jack</small></div><div class="event"><b>客户端陆续同步</b><p>124 人已下载并确认配置版本</p><small>最近回执：今天 10:42</small></div><div class="event"><b>等待 4 位员工上线</b><p>客户端下次启动或恢复前台时检查更新</p><small>尚未收到运行生效回执</small></div></div></article></section><div class="section-title"><h2>版本历史</h2><span style="font-size:10px;color:#97a48d">回滚将发布一个新版本</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>配置版本</th><th>变更说明</th><th>发布范围</th><th>发布人</th><th>状态</th><th></th></tr></thead><tbody>${[0,1,2].map((n)=>`<tr><td><strong>v1.0.${state.revision-n}</strong></td><td>${['全员办公路由优化','更新亚太地区资源池','调整研发服务分流规则'][n]}</td><td>全部授权员工</td><td>Jack</td><td>${badge(n?'历史版本':'当前版本')}</td><td>${n?`<button class="text-link" data-rollback="${state.revision-n}">回滚到此版本</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function audit(){return heading('ACTIVITY LOG','审计记录','记录资源、权限与配置的每一次变更。',btn('导出记录','export','download'))+`<section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input id="search-input" placeholder="搜索操作、对象或操作人" aria-label="搜索审计记录" value="${esc(query)}"></label><span class="badge neutral">本地演示操作会记入此处</span></div><div id="results">${auditTable()}</div></section>`}
function auditTable(){return `<div class="table-wrap"><table><thead><tr><th>操作</th><th>对象</th><th>操作人</th><th>时间</th><th>结果</th></tr></thead><tbody>${state.logs.filter(l=>`${l.action} ${l.target} ${l.actor}`.includes(query)).map(l=>`<tr><td><strong>${esc(l.action)}</strong></td><td>${esc(l.target)}</td><td>${esc(l.actor)}</td><td>${esc(l.time)}</td><td>${badge(l.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">没有匹配的记录</td></tr>'}</tbody></table></div>`}
const field=(label,name,value,help='',readonly=false)=>`<label class="field"><span>${label}</span><input name="${name}" value="${esc(value)}" ${readonly?'readonly':''}>${help?`<small>${help}</small>`:''}</label>`;
const selectField=(label,name,values,selected)=>`<label class="field"><span>${label}</span><select name="${name}">${values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
function settings(){const s=state.settings;return heading('WORKSPACE SETTINGS','工作空间设置','配置组织身份、客户端同步与访问策略。',btn('保存设置','save-settings','check',true))+`<form id="settings-form"><div class="form-grid"><article class="panel form-panel"><h2>组织与飞书</h2><p>员工通过企业自建应用完成身份验证。</p>${field('工作空间名称','workspace',s.workspace)}${field('企业标识','tenant',s.tenant,'用于识别当前工作空间，不代表已验证的飞书租户。')}<div class="detail-row"><span>飞书应用</span>${badge('演示已连接')}</div><div class="detail-row"><span>应用密钥</span><b>由服务端安全保存</b></div><div class="switch-row"><span><b>员工离职联动</b><small>收到组织事件后撤销会话与配置访问</small></span><label class="switch"><input type="checkbox" name="leaver" aria-label="员工离职联动" ${s.leaver?'checked':''}><span></span></label></div><p style="font-size:9px;color:#a59d7c;margin-top:14px">共享节点凭证仍需供应商轮换，才能阻止既有凭证继续使用。</p></article><article class="panel form-panel"><h2>同步与设备策略</h2><p>统一设置员工客户端的默认行为。</p>${selectField('订阅刷新间隔','interval',['每 15 分钟','每 30 分钟','每 1 小时','每 6 小时'],s.interval)}${selectField('每位员工的设备上限','limit',['2 台设备','3 台设备','5 台设备'],s.limit)}${selectField('配置离线宽限期','grace',['不允许离线','1 小时','4 小时','24 小时'],s.grace)}<div class="switch-row"><span><b>登录后自动同步</b><small>移动端后台更新受系统调度限制</small></span><label class="switch"><input type="checkbox" name="auto" aria-label="登录后自动同步" ${s.auto?'checked':''}><span></span></label></div></article><article class="panel form-panel"><h2>服务部署</h2><p>为后续 Google Cloud Run 部署预留的配置视图。</p><div class="detail-row"><span>托管平台</span><b>${icon('cloud')} Google Cloud Run</b></div><div class="detail-row"><span>部署状态</span>${badge('尚未部署')}</div><div class="detail-row"><span>服务域名</span><b>待配置</b></div><div class="detail-row"><span>数据库 / 密钥存储</span><b>待服务端接入</b></div></article><article class="panel form-panel"><h2>原型数据</h2><p>所有操作仅在当前浏览器保存，便于评审界面和流程。导入地址不保存，也不会发起网络请求。</p><button type="button" class="btn" data-action="reset">恢复初始演示数据</button><p>接入正式 API 后，员工、资源和发布状态均由服务端提供。</p></article></div></form>`}
function modal(title,desc,body,submitLabel,onSubmit){modalReturnFocus=document.activeElement;$('#overlay').innerHTML=`<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><div><h2 id="modal-title">${title}</h2><p>${desc}</p></div><button class="close" data-action="close" aria-label="关闭">×</button></div><form id="modal-form">${body}<div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button>${submitLabel?`<button class="btn primary" type="submit">${submitLabel}</button>`:''}</div></form></section></div>`;$('#modal-form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target))};setTimeout(()=>$('#overlay input, #overlay select, #overlay .close')?.focus(),0)}
function close(){const focus=modalReturnFocus;$('#overlay').innerHTML='';focus?.focus()}
function importResource(){modal('导入网络资源','统一接入外购订阅，或添加单独采购的节点。',`<label class="field"><span>资源名称</span><input name="name" required maxlength="60" placeholder="例如：亚太办公订阅"></label>${selectField('资源格式','format',['Clash','sing-box','VLESS','Shadowsocks','Trojan'],'Clash')}<label class="field"><span>订阅链接 / 节点链接</span><textarea name="url" required placeholder="粘贴订阅 URL 或节点链接"></textarea><small>原型仅验证输入，不保存链接，不连接供应商。</small></label><label class="field"><span>供应商名称</span><input name="vendor" required maxlength="40" placeholder="用于识别资源采购来源"></label>`,'添加演示资源',d=>{const url=d.get('url').trim();if(!/^(https?:\/\/|vless:\/\/|ss:\/\/|trojan:\/\/)/i.test(url)){notify('请输入 HTTP(S) 订阅或支持的节点链接');return}const single=!['Clash','sing-box'].includes(d.get('format'));const name=d.get('name').trim(),vendor=d.get('vendor').trim();if(!name||!vendor){notify('请填写资源名称与供应商');return}state.resources.push({id:Date.now(),name,vendor,format:d.get('format'),nodes:single?1:0,status:'待接入',updated:'尚未同步',region:'待解析'});log('导入资源',name);close();render();notify('演示资源已添加；节点解析待接入服务端')})}
function showPool(id){const p=state.pools.find(x=>x.id===id);modal('管理资源池分配',`${esc(p.name)} · ${p.count} 个节点`,`${field('资源池名称','name',p.name)}${field('授权范围','depts',p.depts,'填写部门或员工名称；原型不会查询真实飞书组织。')}<label class="field"><span>资源来源</span>${state.resources.map(r=>`<label style="display:flex;align-items:center;gap:9px;margin-top:10px;font-size:11px;color:#78886e"><input type="checkbox" name="sources" value="${r.id}" ${p.sources.includes(r.id)?'checked':''} style="width:auto">${esc(r.name)}</label>`).join('')}</label>`,'保存分配',d=>{if(!d.get('name').trim()||!d.get('depts').trim()){notify('请填写名称与授权范围');return}p.name=d.get('name').trim();p.depts=d.get('depts').trim();p.sources=d.getAll('sources').map(Number);p.count=state.resources.filter(r=>p.sources.includes(r.id)).reduce((s,r)=>s+r.nodes,0);log('更新资源池',p.name);close();render();notify('资源池分配已保存到演示数据')})}
function showEmployee(id){const e=state.employees.find(x=>x.id===id);modal('管理员工',`${esc(e.name)} · ${esc(e.dept)}`,`<div class="detail-row"><span>飞书身份</span><b>${esc(e.email)}</b></div><div class="detail-row"><span>绑定设备</span><b>${e.devices} 台 · ${esc(e.platform)}</b></div><div style="height:20px"></div>${selectField('分配资源池','pool',state.pools.map(p=>p.name),e.pool)}${selectField('访问状态','status',['已同步','待同步','已停用'],e.status)}<div class="note-box" style="font-size:10px;margin-bottom:0">${icon('alert')}停用可阻止后续配置访问；共享节点的既有凭证需另行轮换。</div>`,'保存权限',d=>{e.pool=d.get('pool');e.status=d.get('status');log('更新员工权限',e.name+' · '+e.status);close();render();notify('员工权限已更新（演示）')})}
function publish(version){modal(version?'回滚配置':'发布新版本',version?`将 v1.0.${version} 的内容发布为更高版本，保留完整历史。`:'发布范围内的员工将在下一次同步时获取新版本。',`<div class="detail-row"><span>新版本</span><b>v1.0.${state.revision+1}</b></div>${selectField('发布范围','scope',['全部授权员工',...state.pools.map(p=>p.name)],'全部授权员工')}<label class="field" style="margin-top:18px"><span>变更说明</span><textarea name="note" required maxlength="300" placeholder="简要描述本次配置变化">${version?'回滚至 v1.0.'+version+' 的配置内容':''}</textarea></label><div class="note-box" style="font-size:10px;margin:0">${icon('shield')}此操作仅演示发布流程，不会下发真实配置。</div>`,'确认发布',d=>{if(!d.get('note').trim()){notify('请填写变更说明');return}state.revision++;log(version?'回滚配置':'发布配置',`v1.0.${state.revision} · ${d.get('scope')} · ${d.get('note').trim()}`);close();render();notify(`演示版本 v1.0.${state.revision} 已发布`)})}
function details(id){const r=state.resources.find(x=>x.id===id);modal('资源详情',esc(r.name),`<div class="detail-row"><span>供应商</span><b>${esc(r.vendor)}</b></div><div class="detail-row"><span>资源格式</span><b>${esc(r.format)}</b></div><div class="detail-row"><span>节点数量</span><b>${r.nodes}</b></div><div class="detail-row"><span>覆盖地区</span><b>${esc(r.region)}</b></div><div class="detail-row"><span>最近同步</span><b>${esc(r.updated)}</b></div><div class="detail-row"><span>状态</span>${badge(r.status)}</div><div class="detail-row"><span>使用此资源的资源池</span><b>${state.pools.filter(p=>p.sources.includes(id)).map(p=>esc(p.name)).join('、')||'尚未分配'}</b></div><p style="color:#9ba48e;font-size:10px;line-height:1.8">订阅链接与节点密钥不在详情中展示。<br>供应商共享凭证：不支持在此单独吊销某位员工。</p>`,'完成',()=>close())}
const actions={import:importResource,close,sync:()=>{state.resources.forEach(r=>{if(r.status!=='待接入')r.updated='刚刚'});log('模拟同步订阅','全部现有资源');render();notify('演示同步已完成；未请求真实订阅')},'feishu-sync':()=>{log('模拟组织同步','RitFit 飞书组织');notify('演示组织同步完成；未连接真实飞书')},publish:()=>publish(),expiry:()=>details(3),'new-pool':()=>modal('创建资源池','按用途组织资源，再分配给部门或员工。',`${field('资源池名称','name','')}${field('用途说明','desc','')}${field('授权范围','depts','')}`,'创建资源池',d=>{const name=d.get('name').trim();if(!name){notify('请输入资源池名称');return}state.pools.push({id:Date.now(),name,desc:d.get('desc').trim()||'自定义资源池',icon:'◎',count:0,members:0,depts:d.get('depts').trim()||'尚未分配',sources:[]});log('创建资源池',name);close();render();notify('资源池已创建，可继续选择资源来源')}),'save-settings':()=>{const d=new FormData($('#settings-form'));if(!d.get('workspace').trim()){notify('请填写工作空间名称');return}state.settings={...Object.fromEntries(d),auto:d.has('auto'),leaver:d.has('leaver')};log('保存工作空间设置',d.get('workspace'));render();notify('设置已保存到当前浏览器')},reset:()=>modal('恢复演示数据','此操作只重置当前浏览器中的原型数据。','<p style="color:#8b987d;font-size:11px">自行添加的演示资源、分配与操作记录将被清除。</p>','恢复初始数据',()=>{state=structuredClone(initial);save();close();render();notify('已恢复初始演示数据')}),export:()=>{const blob=new Blob(['\ufeff'+['操作,对象,操作人,时间,结果',...state.logs.map(l=>[l.action,l.target,l.actor,l.time,l.status].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relay-demo-audit.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('已导出演示审计记录')},guide:()=>modal('从资源到员工，三步完成','Relay 企业网络工作空间',`<div class="detail-row"><span>01 导入资源</span><b>接入订阅或独立节点</b></div><div class="detail-row"><span>02 组织与分配</span><b>创建资源池，授权员工</b></div><div class="detail-row"><span>03 发布配置</span><b>客户端登录后自动同步</b></div><p style="font-size:11px;line-height:1.9;color:#909c85">当前为 UI 原型。资源解析、飞书认证、客户端同步与 Cloud Run 部署将在后续服务端实现。</p>`,'开始使用',()=>{close();go('resources')}),notifications:()=>modal('需要关注','工作空间中的待处理事项',`<div class="detail-row"><span>订阅到期</span><b>北美业务订阅 · 7 天后</b></div><div class="detail-row"><span>配置同步</span><b>4 位员工待上线同步</b></div><div class="detail-row"><span>节点健康</span><b>3 个节点需关注</b></div>`,'知道了',close),workspace:()=>notify('当前工作空间：'+state.settings.workspace),profile:()=>notify('Jack · 工作空间管理员 · 演示身份')};
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.nav)go(el.dataset.nav);else if(el.dataset.action)actions[el.dataset.action]?.();else if(el.dataset.tab){resourceTab=el.dataset.tab;render()}else if(el.dataset.range){chartRange=el.dataset.range;render()}else if(el.dataset.detail)details(+el.dataset.detail);else if(el.dataset.pool)showPool(+el.dataset.pool);else if(el.dataset.employee)showEmployee(+el.dataset.employee);else if(el.dataset.rollback)publish(+el.dataset.rollback)});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){query=e.target.value;updateResults()}});document.addEventListener('change',e=>{if(e.target.id==='status-filter'){filter=e.target.value;updateResults()}});
function updateResults(){if(page==='resources'){$('#results').innerHTML=resourceTable(filteredResources());$('#result-count').textContent=`共 ${filteredResources().length} 个资源`}else if(page==='employees')$('#results').innerHTML=employeeTable();else if(page==='audit')$('#results').innerHTML=auditTable()}
document.addEventListener('keydown',e=>{if(!$('#overlay .modal'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const list=[...$('#overlay').querySelectorAll('button,input,select,textarea')].filter(e=>!e.disabled);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(navs.some(n=>n[0]===p)&&p!==page){page=p;query='';filter='all';render()}});render();
</script>
</body></html>
